<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 1100' width='800' height='1100'>
    <defs>
      <linearGradient id='bgGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
        <stop offset='0%' stop-color='#180728'/>
        <stop offset='60%' stop-color='#0a0f1d'/>
        <stop offset='100%' stop-color='#450a0a'/>
      </linearGradient>
      <radialGradient id='coreGlow' cx='50%' cy='45%' r='40%'>
        <stop offset='0%' stop-color='#f59e0b' stop-opacity='0.45'/>
        <stop offset='100%' stop-color='#f59e0b' stop-opacity='0'/>
      </radialGradient>
      <filter id='blurGlow'>
        <feGaussianBlur stdDeviation='12' result='blur'/>
        <feComposite in='SourceGraphic' in2='blur' operator='over'/>
      </filter>
    </defs>
    <rect width='800' height='1100' fill='url(#bgGrad)'/>
    <circle cx='400' cy='480' r='280' fill='url(#coreGlow)'/>
    <!-- Japanese Title Watermark -->
    <text x='740' y='180' font-family='sans-serif' font-weight='900' font-size='64' fill='rgba(255,255,255,0.06)' text-anchor='end'>アニメ</text>
    <text x='740' y='250' font-family='sans-serif' font-weight='900' font-size='64' fill='rgba(255,255,255,0.06)' text-anchor='end'>プロット</text>
    <!-- Geometric framing & aura -->
    <circle cx='400' cy='480' r='200' fill='none' stroke='#f59e0b' stroke-width='3' opacity='0.7' filter='url(#blurGlow)'/>
    <polygon points='400,230 460,400 630,400 490,500 540,670 400,560 260,670 310,500 170,400 340,400' fill='none' stroke='rgba(255,255,255,0.15)' stroke-width='2'/>
    <!-- Title and details -->
    <rect x='50' y='820' width='700' height='210' rx='16' fill='rgba(15, 23, 42, 0.85)' stroke='rgba(255,255,255,0.15)' stroke-width='1.5'/>
    <text x='80' y='885' font-family='sans-serif' font-weight='900' font-size='38' fill='#ffffff' letter-spacing='1.5'>DRAGON SOUL REALM</text>
    <text x='80' y='935' font-family='sans-serif' font-size='20' fill='#94a3b8'>Ancient Spells & Celestial Beasts</text>
    <rect x='80' y='965' width='160' height='32' rx='6' fill='#f59e0b' opacity='0.9'/>
    <text x='160' y='987' font-family='sans-serif' font-weight='700' font-size='14' fill='#ffffff' text-anchor='middle'>ANIME SERIES</text>
  </svg>